name: Skill Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run skill tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (npm is used by the security gate tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint gate script
        run: shellcheck scripts/security-gate.sh

      # Builds throwaway fixture projects (clean, leaked secrets, open Firebase
      # rules, missing lockfile, .env not ignored) and asserts the gate result
      # for each one, plus registry, typosquat and lockfile-diff tests.
      # Writes evals/test-report.json and the job summary.
      - name: Run test suite
        run: python evals/run_tests.py

      - name: Run security gate on this repo (only if it is a Node project)
        if: hashFiles('package.json') != ''
        run: bash scripts/security-gate.sh .

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: evals/test-report.json
          retention-days: 30
